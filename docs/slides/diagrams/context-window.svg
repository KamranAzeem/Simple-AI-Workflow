<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <style>
    text[font-size="42"] { font-size: 54px; }
    text[font-size="30"] { font-size: 38px; }
    text[font-size="28"] { font-size: 36px; }
    text[font-size="26"] { font-size: 34px; }
    text[font-size="25"] { font-size: 33px; }
    text[font-size="24"] { font-size: 32px; }
    text[font-size="23"] { font-size: 31px; }
    text[font-size="22"] { font-size: 30px; }
    text[font-size="21"] { font-size: 29px; }
    text[font-size="20"] { font-size: 28px; }
    text[font-size="19"] { font-size: 27px; }
    text[font-size="18"] { font-size: 26px; }
    text[font-size="17"] { font-size: 25px; }
    text[font-size="16"] { font-size: 24px; }
    text[font-size="15"] { font-size: 24px; }
    text[font-size="14"] { font-size: 24px; }
  </style>
  <title id="title">The context window is a bounded stage</title>
  <desc id="desc">A context window with four slots for rules, state, work, and code, above a comparison of a web chat and a local assistant.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#22313A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F7FAFB"/>

  <text x="80" y="80" font-family="Lato, Arial, sans-serif" font-size="42" font-weight="700" fill="#2B3A42">The context window is a bounded stage</text>
  <text x="80" y="118" font-family="Lato, Arial, sans-serif" font-size="21" fill="#6B7A82">What is inside it decides what the assistant can know.</text>
  <rect x="80" y="138" width="86" height="5" rx="2.5" fill="#0090C1"/>

  <rect x="200" y="186" width="1200" height="270" rx="24" fill="#FFFFFF" stroke="#0090C1" stroke-width="3" filter="url(#shadow)"/>
  <text x="232" y="226" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#007AA3" letter-spacing="2">CONTEXT WINDOW</text>
  <text x="1368" y="226" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">limited space</text>

  <rect x="232" y="250" width="266" height="170" rx="14" fill="#E6F5FA"/>
  <text x="258" y="292" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#007AA3" letter-spacing="1">RULES</text>
  <text x="258" y="330" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A42">AGENTS.md</text>
  <text x="258" y="360" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">the protocol</text>
  <text x="258" y="386" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">and preferences</text>

  <rect x="524" y="250" width="266" height="170" rx="14" fill="#E6F5FA"/>
  <text x="550" y="292" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#007AA3" letter-spacing="1">STATE</text>
  <text x="550" y="330" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A42">ai/state/</text>
  <text x="550" y="360" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">where we are</text>
  <text x="550" y="386" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">and what is next</text>

  <rect x="816" y="250" width="266" height="170" rx="14" fill="#E6F5FA"/>
  <text x="842" y="292" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#007AA3" letter-spacing="1">WORK</text>
  <text x="842" y="330" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A42">issues, plans</text>
  <text x="842" y="360" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">the ticket</text>
  <text x="842" y="386" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">the approved plan</text>

  <rect x="1108" y="250" width="266" height="170" rx="14" fill="#E6F5FA"/>
  <text x="1134" y="292" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#007AA3" letter-spacing="1">CODE</text>
  <text x="1134" y="330" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A42">src/</text>
  <text x="1134" y="360" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">the files in view</text>
  <text x="1134" y="386" font-family="Lato, Arial, sans-serif" font-size="17" fill="#505962">the tests</text>

  <rect x="60" y="500" width="700" height="270" rx="24" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="60" y="500" width="8" height="270" rx="4" fill="#9BAAB2"/>
  <text x="96" y="548" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="700" fill="#2B3A42">Web chat</text>
  <text x="96" y="580" font-family="Lato, Arial, sans-serif" font-size="19" fill="#007AA3" font-weight="700">You paste it.</text>
  <g font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">
    <text x="96" y="626">Only the current prompt.</text>
    <text x="96" y="658">No project files.</text>
    <text x="96" y="690">No memory after the tab closes.</text>
  </g>
  <text x="96" y="734" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">Start over next time.</text>

  <rect x="840" y="500" width="700" height="270" rx="24" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="840" y="500" width="8" height="270" rx="4" fill="#0090C1"/>
  <text x="876" y="548" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="700" fill="#2B3A42">Local assistant</text>
  <text x="876" y="580" font-family="Lato, Arial, sans-serif" font-size="19" fill="#007AA3" font-weight="700">It reads it.</text>
  <g font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">
    <text x="876" y="626">Your rules, state, work, and code.</text>
    <text x="876" y="658">Memory kept on disk in ai/.</text>
    <text x="876" y="690">Load the right context, not all of it.</text>
  </g>
  <text x="876" y="734" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">Pick up where the last session stopped.</text>

  <rect x="60" y="788" width="1480" height="78" rx="16" fill="#E6F5FA"/>
  <text x="92" y="822" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3" style="font-size:24px">Context is not free: it costs tokens, latency, and attention.</text>
  <text x="92" y="852" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962" style="font-size:24px">A bigger window is not a better memory.</text>
</svg>
