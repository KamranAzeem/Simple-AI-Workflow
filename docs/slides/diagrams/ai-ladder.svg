<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">The AI ladder</title>
  <desc id="desc">Six levels of AI use, with the editor chat at level two and the higher levels left unlabelled.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22313A" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F7FAFB"/>

  <text x="80" y="80" font-family="Lato, Arial, sans-serif" font-size="50" font-weight="700" fill="#2B3A42">Personal AI proficiency model</text>
  <text x="80" y="118" font-family="Lato, Arial, sans-serif" font-size="28" fill="#6B7A82">Where am I now?</text>
  <rect x="80" y="138" width="86" height="5" rx="2.5" fill="#0090C1"/>

  <g font-family="Lato, Arial, sans-serif">
    <rect x="80" y="180" width="1440" height="82" rx="16" fill="#FFFFFF" stroke="#DCE8EC"/>
    <circle cx="126" cy="221" r="24" fill="#EEF3F5"/><text x="126" y="229" text-anchor="middle" font-size="26" font-weight="700" fill="#505962">0</text>
    <text x="180" y="229" font-size="28" font-weight="700" fill="#2B3A42">Not using AI</text>
    <text x="640" y="229" font-size="25" fill="#6B7A82">No assistant in the loop.</text>

    <rect x="80" y="274" width="1440" height="82" rx="16" fill="#FFFFFF" stroke="#DCE8EC"/>
    <circle cx="126" cy="315" r="24" fill="#EEF3F5"/><text x="126" y="323" text-anchor="middle" font-size="26" font-weight="700" fill="#505962">1</text>
    <text x="180" y="323" font-size="28" font-weight="700" fill="#2B3A42">Browser chat</text>
    <text x="640" y="323" font-size="25" fill="#6B7A82">AI assistants in the browser.</text>
    <text x="1300" y="323" font-size="25" fill="#6B7A82">copy/paste hell</text>

    <rect x="80" y="368" width="1440" height="82" rx="16" fill="#E6F5FA" stroke="#0090C1" stroke-width="2"/>
    <circle cx="126" cy="409" r="24" fill="#0090C1"/><text x="126" y="417" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
    <text x="180" y="413" font-size="28" font-weight="700" fill="#2B3A42">Editor chat</text>
    <text x="640" y="405" font-size="25" fill="#505962">Project assistant: context, memory, tools.</text>
    <text x="640" y="433" font-size="24" font-weight="700" fill="#007AA3">Gets 100% of the work done.</text>
    <rect x="1260" y="391" width="220" height="34" rx="17" fill="#0090C1"/>
    <text x="1370" y="415" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">THE WORKFLOW</text>

    <rect x="80" y="462" width="1440" height="82" rx="16" fill="#FFFFFF" stroke="#DCE8EC"/>
    <circle cx="126" cy="503" r="24" fill="#EEF3F5"/><text x="126" y="511" text-anchor="middle" font-size="26" font-weight="700" fill="#505962">3</text>
    <text x="180" y="511" font-size="28" font-weight="700" fill="#2B3A42">Multiple assistants</text>
    <text x="640" y="511" font-size="25" fill="#6B7A82">Several assistants on one project.</text>

    <rect x="80" y="556" width="1440" height="82" rx="16" fill="#FFFFFF" stroke="#DCE8EC"/>
    <circle cx="126" cy="597" r="24" fill="#EEF3F5"/><text x="126" y="605" text-anchor="middle" font-size="26" font-weight="700" fill="#505962">4</text>
    <text x="180" y="605" font-size="28" font-weight="700" fill="#2B3A42">MCPs</text>
    <text x="640" y="605" font-size="25" fill="#6B7A82">Tool bridges and reusable skills.</text>

    <rect x="80" y="650" width="1440" height="82" rx="16" fill="#FFFFFF" stroke="#DCE8EC"/>
    <circle cx="126" cy="691" r="24" fill="#EEF3F5"/><text x="126" y="699" text-anchor="middle" font-size="26" font-weight="700" fill="#505962">5</text>
    <text x="180" y="699" font-size="28" font-weight="700" fill="#2B3A42">Agentic/swarm mode</text>
    <text x="640" y="699" font-size="25" fill="#6B7A82">Agents and swarms that run tasks for you.</text>
  </g>

  <rect x="80" y="752" width="1440" height="100" rx="18" fill="#E6F5FA"/>
  <text x="112" y="790" font-family="Lato, Arial, sans-serif" font-size="28" font-weight="700" fill="#007AA3">I work at level 2: the project assistant with context, memory, and tools.</text>
  <text x="112" y="824" font-family="Lato, Arial, sans-serif" font-size="26" fill="#505962">The state lives in the project, not in the assistant.</text>
</svg>
