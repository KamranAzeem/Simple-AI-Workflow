<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <style>
    text[font-size="42"] { font-size: 48px; }
    text[font-size="30"] { font-size: 34px; }
    text[font-size="28"] { font-size: 32px; }
    text[font-size="26"] { font-size: 30px; }
    text[font-size="25"] { font-size: 29px; }
    text[font-size="24"] { font-size: 28px; }
    text[font-size="23"] { font-size: 27px; }
    text[font-size="22"] { font-size: 26px; }
    text[font-size="21"] { font-size: 25px; }
    text[font-size="20"] { font-size: 24px; }
    text[font-size="19"] { font-size: 23px; }
    text[font-size="18"] { font-size: 22px; }
    text[font-size="17"] { font-size: 21px; }
    text[font-size="16"] { font-size: 20px; }
    text[font-size="15"] { font-size: 19px; }
    text[font-size="14"] { font-size: 18px; }
  </style>
  <title id="title">Where everything lives</title>
  <desc id="desc">The global store and the workflow clone on the left, the project root tree on the right.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#22313A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F7FAFB"/>

  <text x="80" y="80" font-family="Lato, Arial, sans-serif" font-size="42" font-weight="700" fill="#2B3A42">Where everything lives</text>
  <text x="80" y="118" font-family="Lato, Arial, sans-serif" font-size="21" fill="#6B7A82">The global store and the clone on the left. The project tree on the right.</text>
  <rect x="80" y="138" width="86" height="5" rx="2.5" fill="#0090C1"/>

  <rect x="60" y="170" width="460" height="300" rx="24" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <circle cx="102" cy="213" r="8" fill="#505962"/>
  <text x="122" y="222" font-family="Lato, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B3A42">Global</text>
  <text x="122" y="252" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">~/.ai/ across all projects</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#505962">
    <text x="100" y="292">~/.ai/</text>
    <text x="100" y="318">├── settings/</text>
    <text x="100" y="344">│   └── global-user-settings.md</text>
    <text x="100" y="370">├── global-knowledge/</text>
    <text x="100" y="396">└── backups/</text>
  </g>
  <text x="100" y="440" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">Identity, tools, shell, cross-project lessons.</text>

  <rect x="60" y="500" width="460" height="290" rx="24" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <circle cx="102" cy="543" r="8" fill="#505962"/>
  <text x="122" y="552" font-family="Lato, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B3A42">Workflow clone</text>
  <text x="122" y="582" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">The rulebook</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#505962">
    <text x="100" y="620">Simple-AI-Workflow/</text>
    <text x="100" y="643">├── AGENTS.md</text>
    <text x="100" y="666">├── ai/</text>
    <text x="100" y="689">│   ├── policies/</text>
    <text x="100" y="712">│   ├── procedures/</text>
    <text x="100" y="735">│   └── skills/</text>
    <text x="100" y="758">├── docs/</text>
    <text x="100" y="781">└── support-files/</text>
  </g>

  <rect x="570" y="170" width="460" height="610" rx="24" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="570" y="170" width="460" height="8" rx="4" fill="#0090C1"/>
  <circle cx="612" cy="213" r="8" fill="#0090C1"/>
  <text x="632" y="222" font-family="Lato, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B3A42">Project root</text>
  <text x="632" y="252" font-family="Lato, Arial, sans-serif" font-size="17" fill="#6B7A82">This project only</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#505962">
    <text x="600" y="288">.</text>
    <text x="600" y="312">├── AGENTS.md</text>
    <text x="600" y="336">├── ai-customization.md</text>
    <text x="600" y="360" fill="#0090C1" font-weight="700">├── ai/</text>
    <text x="600" y="384">│   ├── state/</text>
    <text x="600" y="408">│   ├── daily-checkpoints/</text>
    <text x="600" y="432">│   ├── issues/</text>
    <text x="600" y="456">│   ├── plans/</text>
    <text x="600" y="480">│   ├── shared/</text>
    <text x="600" y="504">│   │   ├── project-knowledge/</text>
    <text x="600" y="528">│   │   └── handoffs/</text>
    <text x="600" y="552">│   ├── policies/</text>
    <text x="600" y="576">│   ├── skills/</text>
    <text x="600" y="600">│   ├── notes/</text>
    <text x="600" y="624">│   ├── artifacts/</text>
    <text x="600" y="648">│   ├── code-review-reports/</text>
    <text x="600" y="672">│   ├── secrets/</text>
    <text x="600" y="696">│   └── pending/</text>
    <text x="600" y="720">├── design-docs/</text>
    <text x="600" y="744">└── src/</text>
  </g>
  <text x="600" y="772" font-family="Lato, Arial, sans-serif" font-size="16" fill="#6B7A82">State, knowledge, the diary, and the work items.</text>

  <rect x="60" y="800" width="1480" height="64" rx="18" fill="#E6F5FA"/>
  <text x="92" y="830" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="700" fill="#007AA3">Load context reads all three.</text>
  <text x="92" y="860" font-family="Lato, Arial, sans-serif" font-size="20" fill="#505962">The project tree is the memory. The clone is the rulebook. The global store is you.</text>
</svg>
