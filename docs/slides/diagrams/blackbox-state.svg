<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">The state is not a black box</title>
  <desc id="desc">A private, per-assistant state store on the left, and the fixed ai directory layout on the right.</desc>
  <rect width="1600" height="900" fill="#F7FAFB"/>

  <text x="80" y="80" font-family="Lato, Arial, sans-serif" font-size="50" font-weight="700" fill="#2B3A42">Each tool hides its own state</text>
  <text x="80" y="120" font-family="Lato, Arial, sans-serif" font-size="28" fill="#6B7A82">A fixed layout you can inspect beats a private store you cannot.</text>
  <rect x="80" y="140" width="86" height="5" rx="2.5" fill="#0090C1"/>

  <rect x="60" y="200" width="700" height="560" rx="24" fill="#FFFFFF" stroke="#DCE8EC"/>
  <rect x="60" y="200" width="8" height="560" rx="4" fill="#9BAAB2"/>
  <text x="96" y="252" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Without a protocol</text>
  <text x="96" y="288" font-family="Lato, Arial, sans-serif" font-size="24" fill="#6B7A82">Each assistant keeps its own state.</text>

  <rect x="110" y="330" width="230" height="92" rx="16" fill="#EEF2F4"/>
  <text x="225" y="370" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A42">Assistant A</text>
  <text x="225" y="400" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#6B7A82">~/.assistant-a/</text>

  <rect x="470" y="330" width="230" height="92" rx="16" fill="#EEF2F4"/>
  <text x="585" y="370" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A42">Assistant B</text>
  <text x="585" y="400" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#6B7A82">~/.assistant-b/</text>

  <rect x="160" y="482" width="190" height="78" rx="14" fill="#EEF2F4"/>
  <text x="255" y="528" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">logs</text>
  <rect x="430" y="482" width="190" height="78" rx="14" fill="#EEF2F4"/>
  <text x="525" y="528" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">memory</text>
  <rect x="300" y="612" width="200" height="78" rx="14" fill="#EEF2F4"/>
  <text x="400" y="658" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">config</text>

  <path d="M 300 422 C 330 452 330 468 300 482" fill="none" stroke="#9BAAB2" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M 520 422 C 540 452 560 468 560 482" fill="none" stroke="#9BAAB2" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M 400 560 C 400 585 400 598 400 612" fill="none" stroke="#9BAAB2" stroke-width="3" stroke-dasharray="7 6"/>

  <text x="96" y="715" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">Different folders. Different formats.</text>
  <text x="96" y="745" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">No shared truth. No audit trail.</text>

  <rect x="840" y="200" width="700" height="560" rx="24" fill="#FFFFFF" stroke="#0090C1" stroke-width="2"/>
  <rect x="840" y="200" width="8" height="560" rx="4" fill="#0090C1"/>
  <text x="876" y="252" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">With the workflow</text>
  <text x="876" y="288" font-family="Lato, Arial, sans-serif" font-size="24" fill="#6B7A82">One visible layout beside the code.</text>

  <rect x="900" y="330" width="580" height="70" rx="14" fill="#E6F5FA"/>
  <text x="930" y="374" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">ai/state/</text>
  <text x="1450" y="374" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">where we are, what is next</text>

  <rect x="900" y="418" width="580" height="70" rx="14" fill="#E6F5FA"/>
  <text x="930" y="462" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">ai/issues/</text>
  <text x="1450" y="462" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">the work, in the open</text>

  <rect x="900" y="506" width="580" height="70" rx="14" fill="#E6F5FA"/>
  <text x="930" y="550" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">ai/shared/project-knowledge/</text>
  <text x="1450" y="550" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">lessons</text>

  <rect x="900" y="594" width="580" height="70" rx="14" fill="#E6F5FA"/>
  <text x="930" y="638" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">ai/daily-checkpoints/</text>
  <text x="1450" y="638" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">the audit trail</text>

  <text x="876" y="715" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">One layout. One source of truth.</text>
  <text x="876" y="745" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">Every decision leaves a trail.</text>

  <rect x="60" y="800" width="1480" height="70" rx="16" fill="#E6F5FA"/>
  <text x="92" y="845" font-family="Lato, Arial, sans-serif" font-size="26" font-weight="700" fill="#007AA3">The assistant's memory belongs to the project, not to the tool.</text>
</svg>
