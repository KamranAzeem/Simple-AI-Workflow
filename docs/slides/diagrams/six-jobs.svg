<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Six jobs, one protocol</title>
  <desc id="desc">Setup, daily loop, memory, quality, delivery, and maintenance, each with its capabilities.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22313A" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F7FAFB"/>

  <text x="80" y="80" font-family="Lato, Arial, sans-serif" font-size="50" font-weight="700" fill="#2B3A42">The lifecycle of a change</text>
  <text x="80" y="118" font-family="Lato, Arial, sans-serif" font-size="28" fill="#6B7A82">The whole lifecycle, in six boxes.</text>
  <rect x="80" y="138" width="86" height="5" rx="2.5" fill="#0090C1"/>

  <rect x="60" y="200" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="60" y="200" width="8" height="250" rx="4" fill="#0090C1"/>
  <text x="96" y="250" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Setup</text>
  <text x="96" y="296" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">bootstrap</text>
  <text x="96" y="332" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">sync</text>
  <text x="96" y="368" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">customize</text>
  <text x="96" y="414" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">Get the rulebook in place.</text>

  <rect x="570" y="200" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="570" y="200" width="8" height="250" rx="4" fill="#0090C1"/>
  <text x="606" y="250" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Daily loop</text>
  <text x="606" y="296" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">load, plan, implement</text>
  <text x="606" y="332" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">review, checkpoint</text>
  <text x="606" y="368" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">brainstorm, grill, examine</text>
  <text x="606" y="414" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">The fixed shape.</text>

  <rect x="1080" y="200" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="1080" y="200" width="8" height="250" rx="4" fill="#0090C1"/>
  <text x="1116" y="250" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Memory</text>
  <text x="1116" y="296" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">state and diary</text>
  <text x="1116" y="332" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">project and global knowledge</text>
  <text x="1116" y="368" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">handoffs and skills</text>
  <text x="1116" y="414" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">The project's brain.</text>

  <rect x="60" y="480" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="60" y="480" width="8" height="250" rx="4" fill="#0090C1"/>
  <text x="96" y="530" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Quality</text>
  <text x="96" y="576" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">design docs and ADRs</text>
  <text x="96" y="612" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">TDD and tests</text>
  <text x="96" y="648" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">peer review</text>
  <text x="96" y="694" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">Evidence, not hope.</text>

  <rect x="570" y="480" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="570" y="480" width="8" height="250" rx="4" fill="#0090C1"/>
  <text x="606" y="530" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Delivery</text>
  <text x="606" y="576" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">tickets and plans</text>
  <text x="606" y="612" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">merge and release</text>
  <text x="606" y="648" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">outbound scrub</text>
  <text x="606" y="694" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">From issue to merge.</text>

  <rect x="1080" y="480" width="460" height="250" rx="22" fill="#FFFFFF" stroke="#DCE8EC" filter="url(#shadow)"/>
  <rect x="1080" y="480" width="8" height="250" rx="4" fill="#0090C1"/>
  <text x="1116" y="530" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#2B3A42">Maintenance</text>
  <text x="1116" y="576" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">repair state and knowledge</text>
  <text x="1116" y="612" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">backup and recovery</text>
  <text x="1116" y="648" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">token discipline</text>
  <text x="1116" y="694" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">Keep the edge.</text>

  <rect x="60" y="780" width="1480" height="64" rx="16" fill="#E6F5FA"/>
  <text x="92" y="820" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#007AA3">The team layer is optional and separate.</text>
  <text x="600" y="820" font-family="Lato, Arial, sans-serif" font-size="24" fill="#505962">The daily loop is the default; the other jobs support it.</text>
</svg>
