<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <style>
    text[font-size="42"] { font-size: 48px; }
    text[font-size="30"] { font-size: 34px; }
    text[font-size="28"] { font-size: 32px; }
    text[font-size="26"] { font-size: 30px; }
    text[font-size="25"] { font-size: 29px; }
    text[font-size="24"] { font-size: 28px; }
    text[font-size="23"] { font-size: 27px; }
    text[font-size="22"] { font-size: 26px; }
    text[font-size="21"] { font-size: 25px; }
    text[font-size="20"] { font-size: 24px; }
    text[font-size="19"] { font-size: 24px; }
    text[font-size="18"] { font-size: 24px; }
    text[font-size="17"] { font-size: 24px; }
    text[font-size="16"] { font-size: 24px; }
    text[font-size="15"] { font-size: 24px; }
    text[font-size="14"] { font-size: 24px; }
  </style>
  <title id="title">One fixed shape, every session</title>
  <desc id="desc">The fixed few-step loop: load context, plan, implement, review, checkpoint.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22313A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0090C1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7FAFB"/>

  <text x="80" y="80" font-family="Lato, Arial, sans-serif" font-size="42" font-weight="700" fill="#2B3A42">One fixed shape, every session</text>
  <text x="80" y="118" font-family="Lato, Arial, sans-serif" font-size="21" fill="#6B7A82">The order is the protocol.</text>
  <rect x="80" y="138" width="86" height="5" rx="2.5" fill="#0090C1"/>

  <circle cx="800" cy="470" r="252" fill="none" stroke="#C9E6F1" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="800" cy="470" r="120" fill="#E6F5FA"/>
  <circle cx="800" cy="470" r="104" fill="none" stroke="#0090C1" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="800" y="448" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="25" font-weight="700" fill="#2B3A42">The same shape</text>
  <text x="800" y="478" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="19" fill="#505962">every time</text>
  <text x="800" y="512" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#6B7A82">predictable, reproducible,</text>
  <text x="800" y="546" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="24" fill="#6B7A82">auditable</text>

  <g filter="url(#shadow)">
    <rect x="660" y="170" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#DCE8EC"/>
    <rect x="1080" y="350" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#DCE8EC"/>
    <rect x="990" y="640" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#DCE8EC"/>
    <rect x="330" y="640" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#DCE8EC"/>
    <rect x="240" y="350" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#DCE8EC"/>
  </g>

  <g font-family="Lato, Arial, sans-serif">
    <circle cx="694" cy="213" r="18" fill="#0090C1"/><text x="694" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="726" y="221" font-size="23" font-weight="700" fill="#2B3A42">Load context</text>

    <circle cx="1114" cy="393" r="18" fill="#0090C1"/><text x="1114" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="1146" y="401" font-size="23" font-weight="700" fill="#2B3A42">Plan the issue</text>

    <circle cx="1024" cy="683" r="18" fill="#0090C1"/><text x="1024" y="690" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="1056" y="691" font-size="23" font-weight="700" fill="#2B3A42">Implement</text>

    <circle cx="364" cy="683" r="18" fill="#0090C1"/><text x="364" y="690" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
    <text x="396" y="691" font-size="23" font-weight="700" fill="#2B3A42">Review</text>

    <circle cx="274" cy="393" r="18" fill="#0090C1"/><text x="274" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">5</text>
    <text x="306" y="401" font-size="23" font-weight="700" fill="#2B3A42">Checkpoint</text>
  </g>

  <path d="M 940 213 C 1030 213 1040 393 1076 393" fill="none" stroke="#0090C1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1220 436 C 1220 540 1130 540 1130 636" fill="none" stroke="#0090C1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 990 683 L 614 683" fill="none" stroke="#0090C1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 470 640 C 470 560 380 500 380 440" fill="none" stroke="#0090C1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 380 350 C 380 270 560 213 656 213" fill="none" stroke="#0090C1" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="80" y="840" font-family="Lato, Arial, sans-serif" font-size="19" fill="#6B7A82">The detail lives in the procedures.</text>
</svg>
